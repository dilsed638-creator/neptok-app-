<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>
    <linearGradient id="nepCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="50%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#9B0022" />
    </linearGradient>
    <linearGradient id="nepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#nepBg)" />

  <!-- Subtle concentric rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#262630" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Nepalese double-triangle flag crest combined with Play / Music Note -->
  <g filter="url(#glow)">
    <!-- Crimson Flag Pennants stylized as modern video play icon & N -->
    <path d="M 170 120 L 320 200 L 220 220 L 340 310 L 170 330 Z" fill="url(#nepCrimson)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" />
    
    <!-- White Moon & Sun Emblems of Nepal -->
    <!-- Stylized Moon (upper pennant) -->
    <path d="M 205 180 A 18 18 0 1 0 235 175 A 13 13 0 1 1 205 180 Z" fill="#FFFFFF" />
    
    <!-- Stylized Sun (lower pennant) -->
    <circle cx="225" cy="280" r="14" fill="#FFFFFF" />
  </g>

  <!-- Musical vibrance waves -->
  <path d="M 350 250 C 375 220, 395 240, 405 220" fill="none" stroke="url(#nepGold)" stroke-width="8" stroke-linecap="round" />
  <path d="M 370 280 C 390 260, 410 270, 420 260" fill="none" stroke="#FF2A55" stroke-width="6" stroke-linecap="round" />

  <!-- App Name Wordmark -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
    NEP<tspan fill="#FF2A55">TOK</tspan>
  </text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#A1A1AA" letter-spacing="4">
    नेपाल • FOR YOU
  </text>
</svg>
